<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в личный кабинет йоги</title>
</head>
<body style="font-family: sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">

    <div style="background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 320px;">
        <h2 style="text-align: center; color: #2c3e50; margin-top: 0;">Вход для йогов</h2>
        
        <form method="post">
            {% csrf_token %}
            
            {% if form.non_field_errors %}
                <div style="color: red; margin-bottom: 15px; font-size: 14px;">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            <div style="margin-bottom: 15px;">
                {{ form.as_p }}
            </div>
            
            <button type="submit" style="width: 100%; padding: 10px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">
                Войти в практику
            </button>
        </form>
    </div>

</body>
</html>
